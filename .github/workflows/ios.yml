name: iOS

# Builds the iOS app on a GitHub-hosted Mac, signs it and uploads it to
# TestFlight. Start it from the Actions tab or with `gh workflow run ios.yml`.
#
# Signing uses the App Store Connect API key in the repo secrets. The
# distribution certificate is made from CERTIFICATE_PRIVATE_KEY, so every run
# reuses the same certificate instead of creating a new one.
#
# The build keeps the test buttons on (TEST_TOOLS=true) until real step data
# is wired up.
on:
  workflow_dispatch:

env:
  BUNDLE_ID: com.onemillionsteps.oneMillionSteps

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools==0.70.2

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test

      - name: Set up code signing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      # The run number is the build number, so every upload gets a new one.
      - name: Build the IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=TEST_TOOLS=true

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"
